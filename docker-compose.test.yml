# Pocket-ID instance for provider integration/acceptance testing.
#
# The image tag is configurable so the same file can exercise a matrix of Pocket-ID
# versions in CI (STATIC_API_KEY support requires Pocket-ID >= v2.3.0).
#
# Usage:
#   POCKET_ID_IMAGE=pocketid/pocket-id:v2.9.0 \
#   docker compose -f docker-compose.test.yml up -d --wait
#
#   POCKET_ID_BASE_URL=http://localhost:1411 \
#   POCKET_ID_API_KEY=pulumi-test-api-key-0123456789 \
#   go test ./tests/... -run TestAcceptance -count=1 -v
#
#   docker compose -f docker-compose.test.yml down -v

services:
  pocket-id:
    image: ${POCKET_ID_IMAGE:-pocketid/pocket-id:v2}
    restart: "no"
    environment:
      APP_URL: http://localhost:1411
      # Throwaway key for local/CI testing only. Override via the env var if needed.
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-1YaI9eZq0QJgkvpfwkU63QjodNYQoxwthcKHv50R3Ro=}
      # The static API key authenticates as a synthetic admin user, which is exactly
      # what the provider uses (X-API-Key header).
      STATIC_API_KEY: ${POCKET_ID_API_KEY:-pulumi-test-api-key-0123456789}
      DB_PROVIDER: sqlite
      # Rate limiting interferes with rapid test runs.
      DISABLE_RATE_LIMITING: "true"
      TRUST_PROXY: "true"
      AUDIT_LOG_RETENTION_DAYS: "1"
    ports:
      - "1411:1411"
    volumes:
      - pocket-id-data:/app/data
    healthcheck:
      test: ["CMD", "/app/pocket-id", "healthcheck"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 5s

volumes:
  pocket-id-data:
