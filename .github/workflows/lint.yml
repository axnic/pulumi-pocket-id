# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
#
# Lint — Pull-request & main quality gate
#
# Triggered by pull_request events and every push to main.
#
# What it does:
#   1. Runs golangci-lint on Go provider code
#   2. Validates Conventional Commits on every PR commit (or, on a direct
#      push to main, the commits introduced by that push)
#
# Build and test coverage live in integration.yml - this file only covers
# what that one doesn't.

name: Lint

on:
  pull_request: {}
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install tools via mise
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          cache: true

      - name: Run golangci-lint
        run: make lint

  commitlint:
    name: Commit Messages
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Install tools via mise
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          cache: true

      - name: Validate commit messages
        if: github.event_name != 'push'
        run: |
          commitlint \
            --from ${{ github.event.pull_request.base.sha }} \
            --to   ${{ github.event.pull_request.head.sha }} \
            --verbose

      - name: Validate commit messages (push to main)
        if: github.event_name == 'push'
        run: |
          commitlint \
            --from ${{ github.event.before }} \
            --to   ${{ github.event.after }} \
            --verbose
