# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
#
# Pull request — greeting for external PRs
#
# Triggered by pull_request_target events on any branch.
#
# What it does:
#   1. Comments on the PR to welcome external contributors
#
# Uses pull_request_target (not pull_request) so this comment posts even
# for first-time contributors, whose pull_request-triggered workflows
# GitHub holds for approval. Safe here because the job does nothing but
# post a fixed string with the built-in GITHUB_TOKEN - it never checks out
# or executes the PR's own code. lint.yml and integration.yml run on the
# regular pull_request trigger and need no secrets either, so - unlike the
# ci-mgmt-generated version of this file - there's no "wait for a
# maintainer to manually dispatch tests" step to mention here.

name: pull-request
on:
  pull_request_target: {}

jobs:
  comment-on-pr:
    runs-on: ubuntu-latest
    name: comment-on-pr
    permissions:
      pull-requests: write
    steps:
      - name: Comment PR
        uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b # v3.0.1
        with:
          message: >
            Thanks for the contribution! CI runs automatically on this PR -
            a maintainer will review once it's green.
          github-token: ${{ secrets.GITHUB_TOKEN }}
          comment-tag: welcome
    if: github.event.pull_request.head.repo.full_name != github.repository
