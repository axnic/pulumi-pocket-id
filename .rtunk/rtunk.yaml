# Configuration of rtunk for this repository: the linters, runtimes and plugin sources that
# `rtunk check` and `rtunk fmt` use here. rtunk reads the trunk.yaml format. golangci-lint reads
# its own configuration from .golangci.yml.
version: 0.1
cli:
  version: 1.25.0
plugins:
  sources:
    - id: trunk
      ref: v1.11.0
      uri: https://github.com/trunk-io/plugins
runtimes:
  enabled:
    - go@1.25.12
    - node@22.16.0
    - python@3.14.4
lint:
  enabled:
    - gofmt@1.20.4
    - golangci-lint2@2.7.0
    - osv-scanner@2.5.1
    - taplo@0.10.0
    - markdownlint@0.49.1
    - prettier@3.9.6
    - trufflehog@3.97.4
    - yamllint@1.38.0
  ignore:
    # sdk/ is generated by `pulumi package gen-sdk`; never hand-edited.
    - linters: [ALL]
      paths:
        - sdk/
    # ponytail: the style linters below have no repo config yet (hundreds of findings on
    # hand-written docs and workflows); add .markdownlint.yaml / .yamllint and drop these.
    - linters: [markdownlint]
      paths:
        - "*.md"
    - linters: [yamllint]
      paths:
        - "*.yaml"
        - "*.yml"
    # .golangci.yml is golangci-lint's config, not Go source.
    - linters: [golangci-lint2]
      paths:
        - "*.yml"
    # Go dependency vulns are covered by `security:audit` (govulncheck) and Dependabot alerts; osv-scanner
    # flags the current go.mod toolchain/deps until they are bumped.
    - linters: [osv-scanner]
      paths:
        - go.mod
        - go.sum
